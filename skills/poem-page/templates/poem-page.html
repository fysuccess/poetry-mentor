<style>

  --cinnabar:#d96a5a; --cinnabar-dark:#e88a7a; --gold:#d9b45b; --gold2:#b8860b;
  --card:#242119; --line:#3a3628; --shadow:rgba(0,0,0,.35);

}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.7;
  transition:background .35s,color .35s;padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 140px}
/* 顶部导航 */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-title{font-size:17px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-title svg{flex-shrink:0}
/* 品牌徽标（古风印章式） */
.brand-logo{flex-shrink:0;width:26px;height:26px;border-radius:7px;box-shadow:0 1px 4px rgba(120,90,40,.18)}
.badges{display:flex;gap:6px;flex-shrink:0}
.badge{font-size:12px;color:var(--cinnabar);border:1px solid var(--cinnabar);border-radius:999px;padding:2px 10px;background:var(--badge-bg)}
.badge.gold{color:var(--gold);border-color:var(--gold);background:var(--gold-bg)}
/* 主卡片 */
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-top:20px;padding:36px 24px 24px;text-align:center;position:relative;overflow:hidden;box-shadow:0 6px 24px var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 15% 12%,color-mix(in srgb,var(--gold) 8%,transparent) 0,transparent 34%),
  radial-gradient(circle at 88% 82%,color-mix(in srgb,var(--cinnabar) 6%,transparent) 0,transparent 36%);
  pointer-events:none}
.hero .type-line{font-size:13px;color:var(--ink2);letter-spacing:3px;margin-bottom:14px}
.hero h1{font-size:clamp(32px,7vw,44px);font-weight:800;letter-spacing:6px;color:var(--cinnabar);margin-bottom:6px}
.hero .author-line{font-size:15px;color:var(--ink2);margin-bottom:22px}
/* 诗句：横排默认 / 竖排古籍 */
.poem-lines{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;justify-content:center}
.poem-lines button{
  font-family:"KaiTi","STKaiti","楷体",serif;font-size:clamp(19px,4.6vw,25px);line-height:1.9;
  letter-spacing:2px;color:var(--ink);background:none;border:none;cursor:pointer;
  padding:4px 14px;border-radius:10px;transition:all .2s;min-height:44px;width:100%;
}
.poem-lines button:hover,.poem-lines button.speaking{background:var(--hover);color:var(--cinnabar);transform:translateX(2px)}
body.vertical .poem-lines{flex-direction:row;writing-mode:vertical-rl;text-orientation:upright;gap:10px 18px;overflow-x:auto;padding-bottom:8px}
body.vertical .poem-lines button{width:auto;min-height:0;padding:12px 6px;border-left:1px solid var(--line)}
body.vertical .poem-lines button:hover,body.vertical .poem-lines button.speaking{transform:translateX(0)}
body.vertical .famous .f-line{writing-mode:vertical-rl;text-orientation:upright;display:inline-block}
/* 注音 */
ruby{line-height:1.5}
ruby rt{font-size:.48em;font-weight:400;color:var(--gold);letter-spacing:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
/* 拼音显示时字间留距；关闭注音后完全恢复原始字距 */
body:not(.no-ruby) ruby{margin-right:.28em;padding-right:.12em}
body:not(.no-ruby) ruby rt{padding-right:.15em}
body.no-ruby rt{display:none}
/* 可点释义词 */
.w{color:var(--cinnabar);cursor:pointer;border-bottom:1px dashed var(--cinnabar);padding:0 1px;transition:background .15s}
.w:hover,.w.lit{background:var(--hover);border-radius:4px}
.tip-pop{position:fixed;z-index:200;background:var(--bar);color:#fff;font-size:14px;line-height:1.6;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:260px;display:none}
.tip-pop .tp-word{font-weight:700;color:var(--gold2);margin-right:6px}
.summary{font-size:15px;color:var(--ink2);background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 14px;text-align:left}
.hero-copy{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;transition:all .2s}
.hero-copy:hover{color:var(--cinnabar);border-color:var(--cinnabar)}
/* Tab 栏 */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:24px;padding:4px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;font-size:14px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:all .2s;min-height:44px}
.tab.active{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);font-weight:600}
html[data-theme="ink"] .tab.active{color:#1c1a15}
/* 内容卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:14px;padding:22px;box-shadow:0 3px 14px var(--shadow);display:none;animation:fadein .35s ease}
.card.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{font-size:16px;color:var(--cinnabar);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.card h3:first-child{margin-top:0}
.card h3 svg{flex-shrink:0}
/* 年龄段标题：网页隐藏、PDF 显示 */
.age-label{display:none}
.card p{font-size:15px;color:var(--ink);margin-bottom:6px}
.card li{font-size:14.5px;color:var(--ink);margin-left:20px;margin-bottom:4px}
/* 名句 */
.famous{background:linear-gradient(135deg,var(--fam-bg1),var(--fam-bg2));border:1px dashed var(--gold2);border-radius:14px;padding:16px 18px;margin-top:16px}
.famous .f-line{font-family:"KaiTi","STKaiti","楷体",serif;font-size:22px;color:var(--cinnabar);font-weight:700;letter-spacing:2px;margin-bottom:6px;line-height:1.7}
.famous .f-comment{font-size:14px;color:var(--ink2)}
/* 填空游戏 */
.quiz-box{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:16px;padding:22px;box-shadow:0 3px 14px var(--shadow)}
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.quiz-head h3{font-size:16px;color:var(--cinnabar);display:flex;align-items:center;gap:8px}
.quiz-score{font-size:14px;color:var(--gold);font-weight:700}
.q-item{display:none;animation:fadein .3s ease}
.q-item.active{display:block}
.q-line{font-family:"KaiTi","STKaiti","楷体",serif;font-size:clamp(20px,5vw,27px);letter-spacing:2px;color:var(--ink);margin-bottom:16px;line-height:2}
.q-blank{display:inline-block;min-width:1em;border-bottom:2px solid var(--cinnabar);text-align:center;color:var(--cinnabar);font-weight:700;padding:0 .1em}
.q-blank.ok{color:var(--ok);border-color:var(--ok)}
.q-blank.err{color:var(--err);border-color:var(--err);animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.q-opts{display:flex;gap:12px;flex-wrap:wrap}
.q-opt{font-size:clamp(17px,4.5vw,21px);font-family:"KaiTi","STKaiti","楷体",serif;color:var(--cinnabar);background:var(--badge-bg);border:1.5px solid var(--cinnabar);border-radius:12px;padding:8px 22px;cursor:pointer;min-height:44px;transition:all .15s}
.q-opt:active{transform:scale(.94)}
.q-opt:disabled{opacity:.35;cursor:default}
.q-msg{margin-top:12px;font-size:14px;min-height:22px;color:var(--ink2)}
.q-msg.ok{color:var(--ok)}
.q-msg.err{color:var(--err)}
.q-next{margin-top:10px;font-size:14px;color:#fff;background:var(--cinnabar);border:none;border-radius:999px;padding:9px 20px;cursor:pointer;min-height:44px;display:none}
.q-restart{margin-top:14px;font-size:13px;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px}
.q-done{display:none;text-align:center;padding:18px 0}
.q-done .star{font-size:40px;line-height:1}
.q-done p{margin-top:8px;color:var(--ink)}
/* 接龙对战 */
.dragon-box{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:16px;padding:22px;box-shadow:0 3px 14px var(--shadow)}
.dragon-head h3{font-size:16px;color:var(--cinnabar);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dragon-head .sub{font-size:13px;color:var(--ink2);margin-bottom:12px}
.d-char-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.d-char{font-size:16px;color:var(--cinnabar);background:var(--badge-bg);border:1.5px solid var(--cinnabar);border-radius:12px;padding:7px 16px;cursor:pointer;min-height:44px;transition:all .15s}
.d-char.active{background:var(--cinnabar);color:#fff}
html[data-theme="ink"] .d-char.active{color:#1c1a15}
.d-stage{background:var(--ai-bg);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:120px;max-height:300px;overflow-y:auto;margin-bottom:12px}
.d-bubble{max-width:82%;padding:9px 14px;border-radius:14px;font-size:15px;line-height:1.8;margin-bottom:10px;animation:fadein .3s ease}
.d-bubble.ai{background:var(--ai-bg);color:var(--ink);border-bottom-left-radius:4px;float:left;clear:both}
.d-bubble.me{background:var(--me-bg);color:var(--ink);border-bottom-right-radius:4px;float:right;clear:both;text-align:right}
.d-bubble .who{display:block;font-size:12px;color:var(--ink2);margin-bottom:2px}
.d-bubble .verdict{display:block;font-size:12px;margin-top:3px}
.verdict.ok{color:var(--ok)} .verdict.err{color:var(--err)}
.d-input-row{display:flex;gap:8px}
.d-input{flex:1;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);min-height:46px;outline:none}
.d-input:focus{border-color:var(--cinnabar)}
.d-send{font-size:15px;color:#fff;background:var(--cinnabar);border:none;border-radius:12px;padding:0 18px;cursor:pointer;min-height:46px;flex-shrink:0}
.d-ctl{display:flex;gap:8px;margin-top:10px;align-items:center}
.d-btn{font-size:13px;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.d-status{font-size:13px;color:var(--gold);flex:1;text-align:right}
/* 意象雷达图 */
.radar-box{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:16px;padding:22px;box-shadow:0 3px 14px var(--shadow)}
.radar-box h3{font-size:16px;color:var(--cinnabar);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.radar-box .sub{font-size:13px;color:var(--ink2);margin-bottom:8px}
.radar-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.radar-wrap svg{width:100%;max-width:320px;height:auto;margin:0 auto;display:block}
.radar-legend{flex:1;min-width:200px;font-size:14px;color:var(--ink)}
.radar-legend div{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.radar-legend div:last-child{border-bottom:none}
.radar-legend b{color:var(--cinnabar);font-weight:700;font-size:15px}
/* 诗词消消乐 */
.mixer-box{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:16px;padding:22px;box-shadow:0 3px 14px var(--shadow)}
.mixer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mixer-head h3{font-size:16px;color:var(--cinnabar);display:flex;align-items:center;gap:8px}
.mixer-prog{font-size:13px;color:var(--gold);font-weight:700}
.mx-target{font-family:"KaiTi","STKaiti","楷体",serif;font-size:clamp(18px,4.5vw,23px);letter-spacing:2px;color:var(--ink2);min-height:2.2em;border:1.5px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;line-height:1.9}
.mx-target .done{color:var(--ok)}
.mx-target .cur{color:var(--cinnabar);border-bottom:2px solid var(--cinnabar)}
.mx-chars{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mx-char{font-family:"KaiTi","STKaiti","楷体",serif;font-size:clamp(18px,4.5vw,24px);color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 0;width:clamp(40px,9vw,52px);text-align:center;cursor:pointer;min-height:44px;transition:all .15s}
.mx-char:active{transform:scale(.92)}
.mx-char.used{opacity:.18;cursor:default;border-style:dashed}
.mx-char.wrong{color:var(--err);border-color:var(--err);animation:shake .4s}
.mx-msg{margin-top:10px;font-size:14px;min-height:22px;color:var(--ink2)}
.mx-msg.ok{color:var(--ok)}
.mx-msg.err{color:var(--err)}
.mx-next{margin-top:8px;font-size:14px;color:#fff;background:var(--cinnabar);border:none;border-radius:999px;padding:9px 20px;cursor:pointer;min-height:44px;display:none}
.mx-done{display:none;text-align:center;padding:16px 0}
.mx-done .star{font-size:38px;line-height:1}
.mx-done p{margin-top:8px;color:var(--ink)}
/* 导出模式浮层 */
.exp-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(300px,86vw);box-shadow:0 14px 40px rgba(0,0,0,.3);display:none}
.exp-modal h4{font-size:15px;color:var(--cinnabar);text-align:center;margin-bottom:14px}
.exp-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:14px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px;cursor:pointer;min-height:48px;transition:all .15s}
.exp-btn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.exp-btn svg{flex-shrink:0}
.exp-btn small{display:block;color:var(--ink2);font-size:12px;margin-top:1px}
.exp-close{display:block;margin:2px auto 0;font-size:13px;color:var(--ink2);background:none;border:none;cursor:pointer;padding:8px 14px;min-height:40px}
/* 悬浮操作栏 */
.actions{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:4px;background:var(--bar);backdrop-filter:blur(8px);padding:7px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:96vw;overflow-x:auto;scrollbar-width:none}
.actions::-webkit-scrollbar{display:none}
.actions button{display:flex;align-items:center;gap:5px;font-size:13px;color:#fff;background:none;border:none;padding:10px 13px;border-radius:999px;cursor:pointer;transition:background .2s;min-height:44px;white-space:nowrap}
.actions button:hover{background:rgba(255,255,255,.14)}
.actions button svg{flex-shrink:0}
.actions button.on{background:var(--cinnabar)}
html[data-theme="ink"] .actions button.on{background:var(--cinnabar);color:#1c1a15}
/* 页脚 */
.footer{text-align:center;color:var(--ink2);font-size:12.5px;padding:28px 0 8px;letter-spacing:.5px}
#poster{display:none}
@media (max-width:480px){ .actions button{font-size:0} .actions button svg{width:20px;height:20px} .actions button{padding:10px 14px} }

    { key:"junior1", name:"小学低年级", one:"这是李白在月夜里思念家乡的诗，只有二十个字，却非常有名。", scene:"夜深人静，月光洒在床前，亮得好像地上结了一层白霜。诗人抬头看到天上的明月，不禁低下头，思念起远方的故乡。", words:"「疑」是好像；「举头」是抬头；「思」是想念。", feeling:"看到月亮，思念家乡和亲人。", tips:"背诵口诀：床前→疑是→举头→低头，跟着动作记：看床前、低头想霜、抬头望月、低头思乡。" },
    { key:"junior2", name:"小学高年级", one:"借景抒情：月光是引发乡愁的触媒，动作（举头/低头）推动情感层层递进。", scene:"「床前明月光」写环境之静，「疑是地上霜」以错觉写月光之白之寒，营造清冷氛围；「举头望明月」由景入情，「低头思故乡」情到深处，动作转换即情绪转换。", words:"一个「疑」字把月光误作霜的瞬间错觉写活，既写出月色皎洁，也透出夜的寒意与心境的孤寂。", feeling:"全诗不着一个「愁」字，但月光、霜、举头、低头之间，乡愁扑面而来。", tips:"仿写练习：用一个「疑」字写一种错觉（如把雨声当敲门声）。体会「举头」「低头」两个动作中的情绪变化。" },
    { key:"middle", name:"初中", one:"典型的触景生情之作，以「疑霜」错觉传月光之冷、客心之孤。", scene:"首句实写月光入床前，次句虚写错觉「疑是地上霜」——虚实相生，既写月色又写寒意；第三句仰头动作引出望月，末句低头收回，一仰一俯之间，思乡之情喷薄而出。", words:"「疑」字是关键：清醒与恍惚之间，正是乡愁袭来之时。霜既是月光错觉，也是心境的冷。", feeling:"游子望月思乡的普遍情感，千百年来引起共鸣。", tips:"中考古诗鉴赏题型：分析「疑是地上霜」的妙处（比喻/错觉/烘托）。与《九月九日忆山东兄弟》对比：思乡对象与抒情方式异同。" },
    { key:"high", name:"高中", one:"乐府古题新唱，以极简笔法写极深乡愁，是「无意于工而无不工」的典范。", scene:"李白化用乐府旧题《静夜思》，却以白描取代铺陈：纯用眼前景、当下动作，无一字议论抒情，而乡愁自现。月光与霜的错觉，暗含羁旅之寒；举头与低头的动作闭环，正是情动于中的外化。", words:"「明月光—地上霜」通感移觉，「举头—低头」对仗工整，二十字完成「景—情—动作—情」的完整闭环，极简而极丰。", feeling:"个人经验升华为民族集体记忆：望月思乡成为中国文化的永恒母题。", tips:"比较阅读：李白《静夜思》与杜甫《月夜忆舍弟》、苏轼《水调歌头》中的「月」意象演变；探讨宋版「看月光/望山月」与通行本的文本流变。" },
    { key:"adult", name:"成人", one:"千年前的白月光，今天的我们依然被同一轮月亮击中。", scene:"成年之后才懂：床前月光不是霜，是异乡的冷清；举头望月不是诗，是无言的想念。忙碌生活里，这首诗是忽然安静下来的三分钟。", words:"「低头」两个字最动人——不是矫情，是克制。成年人想家，常常就是低下头，继续走路。", feeling:"乡愁不分年代，月亮永远是中国人最温柔的接头暗号。", tips:"亲子共读：给孩子讲这首诗时，先讲「李白想家」，再讲「你出门玩也想家」；可配合《静夜思》童谣视频加深印象。" }
  ],
  famous: [
    { line:"举头望明月，低头思故乡", comment:"一仰一俯之间，乡愁尽出。千古名句，道尽游子心。" },
    { line:"床前明月光，疑是地上霜", comment:"一个「疑」字写活错觉，月色之白、心境之冷俱在。" }
  ],

    "延伸阅读：《月下独酌》《古朗月行》，同是李白咏月名篇"
  ]

/* ===== 渲染（注音 + 释义热词）；withRuby=false 时仅做热词不做注音 ===== */
function annotateText(text, withRuby){
  /* 1. 先把 dict 命中词替换为占位 token（长词优先） */
  var keys = Object.keys(DATA.dict||{}).sort(function(a,b){return b.length-a.length});
  var map = {};
  keys.forEach(function(k,i){
    text = text.split(k).join("[[W"+i+"]]");
    map[i] = k;
  });
  /* 2. 剩余字符做注音，token 还原为可点释义 span */
  var parts = text.split(/\[\[W(\d+)\]\]/);
  var html = "";
  for(var p=0;p<parts.length;p++){
    if(p%2===1){
      var k = map[parts[p]];
      /* 热词：withRuby=true 时内部也逐字注音 */
      if(withRuby === false){
        html += "<span class='w' data-word='"+k+"'>"+k+"</span>";
      } else {
        var kw = "";
        for(var q=0;q<k.length;q++){
          var kch = k[q], kpy = (DATA.annotations && DATA.annotations[kch]) || (PINYIN && PINYIN[kch]);
          kw += kpy ? "<ruby>"+kch+"<rt>"+kpy+"</rt></ruby>" : kch;
        }
        html += "<span class='w' data-word='"+k+"'>"+kw+"</span>";
      }
    } else {
      var seg = parts[p];
      for(var c=0;c<seg.length;c++){
        var ch = seg[c];
        if(/[一-龥]/.test(ch)){
          if(withRuby === false){ html += ch; continue; }
          /* 汉字：DATA.annotations 优先（多音字/古音），否则查全字拼音库 */
          var py = (DATA.annotations && DATA.annotations[ch]) || (PINYIN && PINYIN[ch]);
          html += py ? "<ruby>"+ch+"<rt>"+py+"</rt></ruby>" : ch;
        } else {
          html += ch;
        }
      }
    }
  }
  return html;
}

/* ===== 释义 popover ===== */
var tipPop = document.getElementById("tipPop");
document.addEventListener("click", function(e){
  var w = e.target.closest(".w");
  if(w){
    e.preventDefault(); e.stopPropagation();
    document.querySelectorAll(".w").forEach(function(x){x.classList.remove("lit")});
    w.classList.add("lit");
    tipPop.innerHTML = "<span class='tp-word'>"+w.getAttribute("data-word")+"</span>" + (DATA.dict[w.getAttribute("data-word")]||"");
    tipPop.style.display = "block";
    var r = w.getBoundingClientRect();
    var pw = tipPop.offsetWidth;
    var x = Math.min(Math.max(8, r.left + r.width/2 - pw/2), window.innerWidth - pw - 8);
    var y = r.bottom + 8;
    if(y + tipPop.offsetHeight > window.innerHeight - 8){ y = r.top - tipPop.offsetHeight - 8; }
    tipPop.style.left = x + "px";
    tipPop.style.top = y + "px";
    if("speechSynthesis" in window && w.getAttribute("data-word").length<=2){ speak(w.getAttribute("data-word")); }
  } else {
    tipPop.style.display = "none";
    document.querySelectorAll(".w.lit").forEach(function(x){x.classList.remove("lit")});
  }
});

/* ===== 填空小游戏 ===== */
var quizState = { idx:0, score:0, answered:false };
function buildQuiz(){
  var qs = DATA.quiz || [];
  if(!qs.length){ document.getElementById("quizBox").style.display="none"; return; }
  var body = document.getElementById("quizBody");
  body.innerHTML = "";
  qs.forEach(function(q,i){
    var d = document.createElement("div");
    d.className = "q-item" + (i===0?" active":"");
    d.innerHTML =
      "<div class='q-line'>"+q.text.replace(/_{2,}/,"<span class='q-blank' id='qb"+i+"'>?</span>")+"</div>" +
      "<div class='q-opts' id='qo"+i+"'>" +
        q.options.map(function(o,j){ return "<button class='q-opt' onclick='pick("+i+","+j+")'>"+o+"</button>"; }).join("") +
      "</div>" +
      "<div class='q-msg' id='qm"+i+"'></div>" +
      "<button class='q-next' id='qn"+i+"' onclick='nextQ()'>下一题</button>";
    body.appendChild(d);
  });
  var done = document.createElement("div");
  done.className = "q-done"; done.id = "qDone";
  done.innerHTML = "<div class='star'>⭐</div><p id='qDoneMsg'>全部答对！</p><button class='q-restart' onclick='restartQuiz()'>再玩一次</button>";
  body.appendChild(done);
  updateScore();
}
function pick(qi,oi){
  if(quizState.answered) return;
  var q = DATA.quiz[qi], opt = q.options[oi];
  var blank = document.getElementById("qb"+qi), msg = document.getElementById("qm"+qi);
  var btns = document.querySelectorAll("#qo"+qi+" .q-opt");
  if(opt === q.answer){
    quizState.answered=true; quizState.score++;
    blank.textContent=q.answer; blank.classList.add("ok");
    msg.textContent="✅ 答对了！"+(q.hint||""); msg.className="q-msg ok";
    btns.forEach(function(b){b.disabled=true; if(b.textContent!==q.answer) b.style.visibility="hidden"});
    setTimeout(function(){ speak(q.text.replace("____",q.answer).replace(/[？?，。]/g,"，")); },250);
    updateScore();

var dg = { char:null, aiUsed:{}, meUsed:{}, turn:"ai", over:false, round:0 };
function buildDragon(){
  var keys = Object.keys(DATA.dragon||{});
  if(!keys.length){ document.getElementById("dragonBox").style.display="none"; return; }
  var row = document.getElementById("dChars");
  keys.forEach(function(k){
    var b = document.createElement("button");
    b.className="d-char"; b.textContent=k;
    b.onclick = function(){ dStart(k,b); };
    row.appendChild(b);
  });
}
function dStart(ch,btn){
  dg = { char:ch, aiUsed:{}, meUsed:{}, turn:"ai", over:false, round:0 };
  document.querySelectorAll(".d-char").forEach(function(b){b.classList.remove("active")});
  btn.classList.add("active");
  document.getElementById("dGiveup").style.display="inline-block";
  var stage=document.getElementById("dStage"); stage.innerHTML="";
  document.getElementById("dStatus").textContent = "飞花令：『"+ch+"』";
  document.getElementById("dInput").value="";
  dg.turn="ai";
  setTimeout(function(){ dAI(); },100);
}
function dPick(){
  var bank = DATA.dragon[dg.char]||[];
  var fresh = bank.filter(function(l){ return !dg.aiUsed[l]; });
  if(!fresh.length) return null;
  var l = fresh[Math.floor(Math.random()*fresh.length)];
  dg.aiUsed[l]=true;
  return l;
}
function dAI(){
  if(dg.over) return;
  dg.turn="ai";
  var l = dPick();
  if(!l){
    dAdd("ai","AI 接不上啦……","我认输！你赢啦 🎉");
    dEnd("你赢了！AI 的诗句都用完了");
    return;
  }
  dAdd("ai","AI",""+l);
  dg.turn="me";
  document.getElementById("dInput").focus();
  setTimeout(function(){ if("speechSynthesis" in window) speak(l); },300);
}
function dAdd(who,label,html){
  var stage=document.getElementById("dStage");
  var d=document.createElement("div");
  d.className="d-bubble "+who;
  d.innerHTML="<span class='who'>"+label+"</span>"+html;
  stage.appendChild(d);
  stage.scrollTop=stage.scrollHeight;
}
function dSend(){
  if(dg.over||!dg.char) return;
  if(dg.turn!=="me"){ toast("等 AI 出完你再接"); return; }
  var inp=document.getElementById("dInput");
  var t=(inp.value||"").trim().replace(/[，。！？、；：""''（）]/g,"");
  if(!t){ toast("先输入一句诗吧"); return; }
  if(t.length<4){ toast("句子太短啦"); return; }
  if(t.indexOf(dg.char)<0){
    dAdd("me","我","<span style='color:var(--err)'>"+t+"</span><span class='verdict err'>✗ 这句里没有『"+dg.char+"』字</span>");
    return;
  }
  if(dg.meUsed[t]||dg.aiUsed[t]){
    dAdd("me","我","<span style='color:var(--err)'>"+t+"</span><span class='verdict err'>✗ 这句已经说过了</span>");
    return;
  }
  dg.meUsed[t]=true;
  dAdd("me","我","<span style='color:var(--ok)'>"+t+"</span><span class='verdict ok'>✓ 接得好</span>");
  inp.value="";
  dg.turn="ai";
  setTimeout(dAI, 600);
}
function dGiveup(){
  if(dg.over) return;
  dAdd("me","我","<span style='color:var(--ink2)'>我认输……</span>");
  dEnd("AI 赢了！再接再厉，多读几首含『"+dg.char+"』的诗吧");
  dg.over=true;
}
function dEnd(msg){
  dg.over=true;

  document.getElementById("dGiveup").style.display="none";
  var inp=document.getElementById("dInput"); inp.value="";
}

/* ===== 意象雷达图（内联 SVG 手绘） ===== */
function buildRadar(){
  if(!DATA.radar || !DATA.radar.labels || !DATA.radar.values){ document.getElementById("radarBox").style.display="none"; return; }
  var lab = DATA.radar.labels, val = DATA.radar.values;
  document.getElementById("radarSub").textContent = DATA.radar.note || "从五个维度品读这首诗";
  var wrap = document.getElementById("radarWrap");
  wrap.innerHTML = svgRadar(lab,val) + legendRadar(lab,val);
}
function svgRadar(lab,val){
  var n = lab.length, W=320, H=300, cx=W/2, cy=H/2+4, R=104;
  var cs = getComputedStyle(document.documentElement);
  var red = cs.getPropertyValue("--cinnabar").trim() || "#a63d2f";
  var gold = cs.getPropertyValue("--gold").trim() || "#b8860b";
  var ink = cs.getPropertyValue("--ink").trim() || "#2b2b2b";
  var sub = cs.getPropertyValue("--ink2").trim() || "#5a5446";
  var line = cs.getPropertyValue("--line").trim() || "#e5dcc3";
  var pt = function(i,r){ var a=-Math.PI/2 + i*2*Math.PI/n; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  var poly = function(r,cls){
    var p="";
    for(var i=0;i<n;i++){ var c=pt(i,r); p += (i?"L":"M")+c[0].toFixed(1)+" "+c[1].toFixed(1); }
    return p+"Z";
  };
  var s = "<svg viewBox='0 0 "+W+" "+H+"' role='img' aria-label='意象雷达图'>";
  /* 网格环 */
  for(var g=1;g<=4;g++){ s += "<path d='"+poly(R*g/4,0)+"' fill='none' stroke='"+line+"' stroke-width='1'/>"; }
  for(var i=0;i<n;i++){ var c=pt(i,R); s += "<line x1='"+cx+"' y1='"+cy+"' x2='"+c[0].toFixed(1)+"' y2='"+c[1].toFixed(1)+"' stroke='"+line+"' stroke-width='1'/>"; }
  /* 数据多边形 */
  var dp="";
  for(var j=0;j<n;j++){ var d=pt(j,R*val[j]/100); dp += (j?"L":"M")+d[0].toFixed(1)+" "+d[1].toFixed(1); }
  s += "<path d='"+dp+"Z' fill='"+hexA(red,.22)+"' stroke='"+red+"' stroke-width='2.5' stroke-linejoin='round'/>";
  /* 数据点 */
  for(var k=0;k<n;k++){ var dp2=pt(k,R*val[k]/100); s += "<circle cx='"+dp2[0].toFixed(1)+"' cy='"+dp2[1].toFixed(1)+"' r='4' fill='"+red+"' stroke='"+cs.getPropertyValue('--card').trim()+"' stroke-width='1.5'/>"; }
  /* 标签 */
  for(var m=0;m<n;m++){
    var lp=pt(m,R+26), tx=lp[0], ty=lp[1]+5;
    var va="middle";
    if(Math.abs(lp[1]-cy)<6) va="middle";
    s += "<text x='"+tx.toFixed(1)+"' y='"+ty.toFixed(1)+"' text-anchor='middle' dominant-baseline='"+va+"' font-size='13' fill='"+sub+"'>"+lab[m]+"</text>";
  }
  /* 中心分值 */
  s += "<text x='"+cx+"' y='"+cy+"' text-anchor='middle' dominant-baseline='middle' font-size='13' fill='"+gold+"' font-weight='700'>"+Math.round(val.reduce(function(a,b){return a+b})/n)+"</text>";
  s += "</svg>";
  return s;
}
function legendRadar(lab,val){
  var h="<div class='radar-legend'>";
  lab.forEach(function(l,i){
    h += "<div><span>"+l+"</span><b>"+val[i]+"</b></div>";
  });
  h += "</div>";
  return h;
}

/* ===== 诗词消消乐（打乱字块拼诗句） ===== */
var mx = { idx:0, pos:0, chars:[], line:"" };
function buildMixer(){
  if(!DATA.content || DATA.content.length<2){ document.getElementById("mixerBox").style.display="none"; return; }
  mxRestart();
}
function mxShuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function mxLoad(idx){
  mx.idx=idx; mx.pos=0;
  mx.line = DATA.content[idx].replace(/[，。！？、；：]/g,"");
  mx.chars = mxShuffle(mx.line.split("").map(function(ch){ return {ch:ch, used:false}; }));
  renderMixer();
}
function renderMixer(){
  document.getElementById("mixerProg").textContent = (mx.idx+1)+" / "+DATA.content.length;
  var tgt = document.getElementById("mxTarget");
  tgt.innerHTML = "";
  for(var i=0;i<mx.line.length;i++){
    var sp=document.createElement("span");
    sp.className = i<mx.pos ? "done" : (i===mx.pos ? "cur" : "");
    sp.textContent = i<mx.pos ? mx.line[i] : (i===mx.pos ? "＿" : "＿");
    tgt.appendChild(sp);
  }
  var box=document.getElementById("mxChars");
  box.innerHTML="";
  mx.chars.forEach(function(c,ci){
    var b=document.createElement("button");
    b.className="mx-char"; b.textContent=c.ch;
    if(c.used) b.classList.add("used");
    b.onclick=function(){ mxPick(ci); };
    box.appendChild(b);
  });
  document.getElementById("mxMsg").textContent="";
  document.getElementById("mxNext").style.display="none";
  document.getElementById("mxDone").style.display="none";
}
function mxPick(ci){
  var c=mx.chars[ci];
  if(c.used) return;
  var need = mx.line[mx.pos];
  if(c.ch === need){
    c.used=true; mx.pos++;
    var box=document.getElementById("mxChars");
    box.children[ci].classList.add("used");
    if(mx.pos===mx.line.length){
      document.getElementById("mxMsg").textContent="✅ 拼对啦！"; document.getElementById("mxMsg").className="mx-msg ok";
      setTimeout(function(){ speak(DATA.content[mx.idx]); },200);
      if(mx.idx < DATA.content.length-1){ document.getElementById("mxNext").style.display="inline-block"; }
      else{ setTimeout(function(){ document.getElementById("mxDone").style.display="block"; },400); }
    }
  } else {
    var b = document.getElementById("mxChars").children[ci];
    b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
    document.getElementById("mxMsg").textContent="这个字不在这个位置哦，再想想～"; document.getElementById("mxMsg").className="mx-msg err";
    setTimeout(function(){ b.classList.remove("wrong"); },450);
  }
  renderMixerPartial();
}
function renderMixerPartial(){
  var tgt=document.getElementById("mxTarget");
  var nodes=tgt.children;
  for(var i=0;i<mx.line.length;i++){
    nodes[i].className = i<mx.pos ? "done" : (i===mx.pos ? "cur" : "");
    nodes[i].textContent = i<mx.pos ? mx.line[i] : (i===mx.pos ? "＿" : "＿");
  }
}
function mixerNext(){ mxLoad(mx.idx+1); }
function mxRestart(){
  document.getElementById("mxDone").style.display="none";
  mxLoad(0);
}

function speak(text){

  var u=new SpeechSynthesisUtterance(text);

/* 居中换行（textAlign=center 时按行绘制） */
function wrapTextCentered(ctx,text,cx,y,maxW,lh){
  var chars = text.split(""), line="";
  ctx.textAlign="center";
  for(var i=0;i<chars.length;i++){
    var test=line+chars[i];
    if(ctx.measureText(test).width>maxW && line){
      ctx.fillText(line, cx, y); line=chars[i]; y+=lh;
    } else line=test;
  }
  if(line) ctx.fillText(line, cx, y);
}
/* 自动换行并返回新的 y 坐标 */
function wrapText2(ctx,text,x,y,maxW,lh){
  var chars = text.split(""), line="";
  for(var i=0;i<chars.length;i++){
    var test=line+chars[i];
    if(ctx.measureText(test).width>maxW && line){
      ctx.fillText(line,x,y); line=chars[i]; y+=lh;
    } else line=test;
  }
  if(line) ctx.fillText(line,x,y);
  return y;
}
/* Canvas 手绘雷达图 */
function drawRadarCanvas(ctx,cx,cy,R,radar){
  if(!radar || !radar.labels) return;
  var n = radar.labels.length, val = radar.values;
  var pt = function(i,r){ var a=-Math.PI/2 + i*2*Math.PI/n; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  var cs = getComputedStyle(document.documentElement);
  var red = cs.getPropertyValue("--cinnabar").trim() || "#a63d2f";
  var lineC = cs.getPropertyValue("--line").trim() || "#e5dcc3";
  var sub = cs.getPropertyValue("--ink2").trim() || "#8a7f63";
  var gold = cs.getPropertyValue("--gold").trim() || "#b8860b";
  /* 网格环 */
  ctx.strokeStyle=lineC; ctx.lineWidth=1;
  for(var g=1;g<=4;g++){
    ctx.beginPath();
    for(var i=0;i<=n;i++){ var c0=pt(i%n,R*g/4); i?ctx.lineTo(c0[0],c0[1]):ctx.moveTo(c0[0],c0[1]); }
    ctx.stroke();
  }
  /* 轴线 */
  for(var i2=0;i2<n;i2++){ var ax=pt(i2,R); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ax[0],ax[1]); ctx.stroke(); }
  /* 数据多边形 */
  ctx.beginPath();
  for(var j=0;j<n;j++){ var d=pt(j,R*val[j]/100); j?ctx.lineTo(d[0],d[1]):ctx.moveTo(d[0],d[1]); }
  ctx.closePath();
  ctx.fillStyle=hexA(red,.22); ctx.fill();
  ctx.strokeStyle=red; ctx.lineWidth=2.5; ctx.stroke();
  /* 数据点 */
  for(var k=0;k<n;k++){ var dp=pt(k,R*val[k]/100); ctx.beginPath(); ctx.arc(dp[0],dp[1],4,0,Math.PI*2); ctx.fillStyle=red; ctx.fill(); }
  /* 标签 */
  ctx.fillStyle=sub; ctx.font="20px sans-serif"; ctx.textAlign="center";
  for(var m2=0;m2<n;m2++){ var lp=pt(m2,R+30); ctx.fillText(radar.labels[m2], lp[0], lp[1]+6); }
  ctx.fillStyle=gold; ctx.font="bold 22px sans-serif";
  ctx.fillText(Math.round(val.reduce(function(a,b){return a+b})/n), cx, cy+8);
}

function exportPoster(vertical){
  closeExpModal();
  if(vertical){ exportPosterVertical(); return; }
  exportPosterModern();
}
function exportPosterModern(){
  toast("正在生成图片…");
  setTimeout(function(){
    var dark=themeIdx===1;
    var W=1080;
    var ink=dark?"#e8e2d2":"#2b2b2b",sub=dark?"#b8b0a0":"#8a7f63";
    var red=dark?"#d96a5a":"#a63d2f",gold=dark?"#d9b45b":"#b8860b";
    /* 自适应字号：按最长句字数限制正文大小 */
    var cleanLines=DATA.content.map(function(l){return l.replace(/[，。！？、；：]/g,"")});
    var maxLen=1; cleanLines.forEach(function(l){maxLen=Math.max(maxLen,l.length)});
    var poemFont=Math.min(64, Math.floor(800/maxLen));
    var lineH=poemFont*1.5;
    /* 动态高度 */
    var topArea=330, poemArea=cleanLines.length*lineH+40, famArea=DATA.famous.length?230:40, summaryArea=170, footArea=130;
    var H=topArea+poemArea+famArea+summaryArea+footArea;
    var c=document.createElement("canvas");
    c.width=W;c.height=H;var ctx=c.getContext("2d");
    var bg1=dark?"#1c1a15":"#faf6ec",bg2=dark?"#2b271c":"#f1e8d3";
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,bg1);g.addColorStop(1,bg2);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=hexA(gold,.25);ctx.lineWidth=3;
    corner(ctx,50,60,90,true);corner(ctx,W-50,60,90,false);
    ctx.strokeStyle=hexA(red,.2);ctx.lineWidth=2;
    circleDecor(ctx,W/2,180,110);
    drawBrandMark(ctx, W-118, 92, dark);
    ctx.textAlign="center";
    ctx.fillStyle=sub;ctx.font="34px sans-serif";
    ctx.fillText(DATA.dynasty+" · "+DATA.author+" · "+DATA.type,W/2,140);
    ctx.fillStyle=red;ctx.font="bold 92px 'KaiTi','STKaiti',serif";
    ctx.fillText("《"+DATA.title+"》",W/2,260);
    ctx.strokeStyle=hexA(gold,.5);ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(W/2-130,310);ctx.lineTo(W/2+130,310);ctx.stroke();
    /* 正文（自适应字号，垂直居中分布） */
    ctx.fillStyle=ink;ctx.font=poemFont+"px 'KaiTi','STKaiti',serif";
    var totalText=cleanLines.length*lineH;
    var y=330+(poemArea-totalText)/2+poemFont;
    cleanLines.forEach(function(line){
      ctx.fillText(line,W/2,y);
      y+=lineH;
    });
    /* 名句框（自适应宽度） */
    var fam=DATA.famous[0];
    if(fam){
      var fw=Math.min(820, Math.max(520, ctx.measureText(fam.line).width+120));
      ctx.strokeStyle=hexA(red,.4);ctx.lineWidth=2;ctx.setLineDash([12,8]);
      roundRect(ctx,W/2-fw/2,y-15,fw,190,16);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=red;ctx.font="bold 46px 'KaiTi','STKaiti',serif";
      ctx.fillText(fam.line,W/2,y+58);
      ctx.fillStyle=sub;ctx.font="30px sans-serif";
      var cl=fam.comment.length>22?fam.comment.slice(0,22)+"…":fam.comment;
      ctx.fillText(cl,W/2,y+128);
      y+=210;
    }
    /* 一句话总评 */
    ctx.fillStyle=sub;ctx.font="34px sans-serif";
    var sw=(W-320)/34;
    var sline=DATA.summary.length>sw?DATA.summary.slice(0,sw)+"…":DATA.summary;
    ctx.fillText(sline,W/2,y+20);
    /* 底部品牌 */
    ctx.fillStyle=hexA(sub,.8);ctx.font="26px sans-serif";
    ctx.fillText("—— 古诗词趣味工坊 · 让读诗成趣 ——",W/2,H-60);
    c.toBlob(function(blob){
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=DATA.title+"_"+DATA.author+"_赏析.png";
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
      toast("图片已导出");
    },"image/png");
  },80);
}
function hexA(hex,a){var n=parseInt(hex.slice(1),16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"}
/* ===== 竖排古籍风海报（重制：标题横排 + 正文居中竖排 + 名句横排） ===== */
function exportPosterVertical(){
  toast("正在生成古籍海报…");
  setTimeout(function(){
    var W=1080;
    var paper="#f6efe0", ink="#3a3428", sub="#8a7f63", red="#9a3b2e";
    /* 自适应：列宽按句数、最长句限制字高、画布按内容算 */
    var lines=DATA.content.map(function(l){return l.replace(/[，。！？、；：]/g,"")});
    var maxL=1; lines.forEach(function(l){ maxL=Math.max(maxL,l.length); });
    var cols=lines.length;
    var colW=Math.min(115, Math.floor((W-300)/cols));
    var charH=Math.min(80, Math.floor(680/maxL));
    var poemW = cols*colW;
    var poemTop = 290, poemBottom = poemTop + maxL*charH + 20;
    var famH = DATA.famous.length ? 150 : 60;
    var bottomH = 200;
    var H = poemBottom + famH + bottomH;
    var c=document.createElement("canvas");
    c.width=W;c.height=H;var ctx=c.getContext("2d");
    /* 仿宣纸底 */
    ctx.fillStyle=paper;ctx.fillRect(0,0,W,H);
    /* 衬纸纹理 */
    ctx.fillStyle="rgba(154,59,46,.04)";
    for(var t=0;t<40;t++){ ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*8+2,Math.random()*8+2); }
    /* 外框（古籍书页双线） */
    ctx.strokeStyle="rgba(58,52,40,.45)";ctx.lineWidth=2;
    ctx.strokeRect(46,46,W-92,H-92);
    ctx.strokeStyle="rgba(58,52,40,.2)";ctx.lineWidth=1;
    ctx.strokeRect(62,62,W-124,H-124);
    /* 顶部：朝代·作者·体裁（横排小字） */
    ctx.textAlign="center";
    ctx.fillStyle=sub;ctx.font="30px 'KaiTi','STKaiti',serif";
    ctx.fillText(DATA.dynasty+" · "+DATA.author+" · "+DATA.type,W/2,128);
    /* 标题（横排红色大字，居中） */
    ctx.fillStyle=red;ctx.font="bold 88px 'KaiTi','STKaiti',serif";
    ctx.fillText("《"+DATA.title+"》",W/2,222);
    /* 标题下分隔线 */
    ctx.strokeStyle="rgba(154,59,46,.4)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(W/2-90,252);ctx.lineTo(W/2+90,252);ctx.stroke();
    /* 正文竖排：从右往左逐列居中 */
    var startX = (W + poemW)/2 - colW/2;
    ctx.fillStyle=ink;ctx.font="bold "+(charH*0.86)+"px 'KaiTi','STKaiti',serif";
    ctx.textAlign="center";
    lines.forEach(function(line,li){
      var x = startX - li*colW;
      for(var k=0;k<line.length;k++){ ctx.fillText(line[k], x, poemTop + k*charH + charH*0.78); }
    });
    /* 名句横排（朱红大字，居中） */
    var fam=DATA.famous[0];
    var famY = poemBottom + 60;
    if(fam){
      ctx.fillStyle=red;ctx.font="bold 42px 'KaiTi','STKaiti',serif";
      ctx.fillText("「"+fam.line+"」",W/2,famY);
      ctx.fillStyle=sub;ctx.font="26px 'KaiTi','STKaiti',serif";
      var cl=fam.comment.length>28?fam.comment.slice(0,28)+"…":fam.comment;
      ctx.fillText(cl,W/2,famY+46);
    }
    /* 朱红印章「詩」在底部左侧 */
    var sx=130, sy=H-180, ss=110;
    ctx.fillStyle=red;roundRect(ctx,sx,sy,ss,ss,12);ctx.fill();
    ctx.fillStyle=paper;ctx.font="bold 60px 'KaiTi','STKaiti',serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("詩",sx+ss/2,sy+ss/2+4);
    ctx.textBaseline="alphabetic";
    /* 落款居中 */
    ctx.textAlign="center";
    ctx.fillStyle=sub;ctx.font="26px 'KaiTi','STKaiti',serif";
    ctx.fillText("—— "+DATA.author+" 诗 · 古诗词趣味工坊 ——",W/2,H-50);
    c.toBlob(function(blob){
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=DATA.title+"_"+DATA.author+"_古籍海报.png";
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
      toast("古籍海报已导出");
    },"image/png");
  },80);
}
function corner(ctx,x,y,s,flip){ctx.beginPath();if(flip){ctx.moveTo(x+s,y);ctx.lineTo(x,y);ctx.lineTo(x,y+s)}else{ctx.moveTo(x-s,y);ctx.lineTo(x,y);ctx.lineTo(x,y+s)}ctx.stroke()}
function circleDecor(ctx,cx,cy,r){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,r-18,0,Math.PI*2);ctx.stroke();ctx.fillStyle="rgba(184,134,11,.15)";ctx.beginPath();ctx.arc(cx,cy,r-9,0,Math.PI*2);ctx.fill()}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
/* 品牌徽标（Canvas 印章式：圆底+弯月+诗字+方印） */
function drawBrandMark(ctx,cx,cy,dark){
  var r=40, gold=dark?"#d9b45b":"#b8860b", red=dark?"#d96a5a":"#a63d2f";
  var card=dark?"#242119":"#fffdf6";
  ctx.save();
  /* 圆底 */
  ctx.fillStyle=card; ctx.strokeStyle=gold; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  /* 虚线内环 */
  ctx.strokeStyle=gold; ctx.lineWidth=1; ctx.setLineDash([3,3]); ctx.globalAlpha=.6;
  ctx.beginPath(); ctx.arc(cx,cy,r-9,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
  /* 金铜弯月（右上） */
  ctx.fillStyle=gold;
  ctx.beginPath(); ctx.arc(cx+r*0.48, cy-r*0.48, r*0.24, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle=card;
  ctx.beginPath(); ctx.arc(cx+r*0.60, cy-r*0.60, r*0.22, 0, Math.PI*2); ctx.fill();
  /* 朱红"诗"字 */
  ctx.fillStyle=red; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font="bold "+(r*1.05)+"px 'KaiTi','STKaiti',serif";
  ctx.fillText("诗", cx, cy+r*0.12);
  /* 小方印"趣" */
  var ss=r*0.38;
  roundRect(ctx, cx+r*0.42, cy+r*0.42, ss, ss, ss*0.2); ctx.fill();
  ctx.fillStyle=card; ctx.font="bold "+(ss*0.72)+"px 'KaiTi','STKaiti',serif";
  ctx.fillText("趣", cx+r*0.42+ss/2, cy+r*0.42+ss/2+1);
  ctx.textBaseline="alphabetic";
  ctx.restore();
}
function wrapText(ctx,text,x,y,maxW,lh){var chars=text.split(""),line="";for(var i=0;i<chars.length;i++){var test=line+chars[i];if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,y);line=chars[i];y+=lh}else line=test}if(line)ctx.fillText(line,x,y)}

/* ===== 轻提示 ===== */
var toastEl=null;
function toast(msg){
  if(!toastEl){
    toastEl=document.createElement("div");
    toastEl.className="toast-msg";
    toastEl.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(43,43,43,.92);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;z-index:999;transition:opacity .3s;pointer-events:none;max-width:340px;text-align:center;line-height:1.6";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent=msg;toastEl.style.opacity="1";
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(function(){toastEl.style.opacity="0"},1800);
}
